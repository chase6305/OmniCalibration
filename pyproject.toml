[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicalib-reproduction"
version = "0.3.1"
description = "Independent OmniCalib numerical baseline with synthetic validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
assets = ["trimesh>=4.4,<5"]
simulation = ["trimesh>=4.4,<5", "rtree>=1.3,<2", "embreex>=4.3,<5"]
plots = ["matplotlib>=3.8,<4"]
dev = ["ruff==0.17.4", "pytest>=8,<10"]

[project.scripts]
omnicalib = "omnicalib.__main__:main"

[tool.setuptools.packages.find]
include = ["omnicalib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
